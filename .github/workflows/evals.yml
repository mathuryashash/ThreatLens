name: evals

on:
  push:
    paths: ["backend/**", "evals/**", ".github/workflows/evals.yml"]
  pull_request:
    paths: ["backend/**", "evals/**", ".github/workflows/evals.yml"]
  workflow_dispatch:

# No LLM keys are used: the LLM-backed eval replays recorded responses from evals/cache
# (--cache readonly fails on any cache miss, so a prompt change without re-recording fails CI).
env:
  ALLOW_MOCK_DB: "true"
  SUPABASE_URL: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  DATABASE_URL: ""

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio requests "langfuse==4.16.0"
      - name: Unit tests (incl. tracing no-op / stub-span tests)
        working-directory: backend
        run: python -m pytest -q
      - name: Golden set is reproducible
        run: |
          python evals/golden/build_golden.py
          git diff --exit-code evals/golden/golden.jsonl
      - name: Rules-only eval (deterministic) with thresholds
        run: python evals/run.py --provider rules --split test --tag ci --min-precision 0.97 --min-recall 0.55
      - name: Cached Gemini pipeline eval with thresholds
        run: python evals/run.py --provider gemini --split test --cache readonly --tag ci --min-f1 0.95 --min-precision 0.95
      - name: Cached judge agreement (held-out)
        run: python evals/judge/judge.py --prompt v2 --part heldout --cache readonly
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Promptfoo regression suite (cached provider)
        working-directory: evals/promptfoo
        env:
          PROMPTFOO_PYTHON: python
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx -y promptfoo@latest eval -c promptfooconfig.yaml --no-cache --max-concurrency 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
